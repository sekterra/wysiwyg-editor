<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>SunEditor — Shadow DOM 데모</title>
	<!-- 저장소에서 test/dev/ 깊이로 두 단계 올라가 루트(dist, src)를 가리킵니다. -->
	<base href="../../" />
	<link rel="stylesheet" href="dist/suneditor.min.css" />
	<link rel="stylesheet" href="dist/suneditor-contents.min.css" />
	<style>
		body { margin: 0; padding: 0.75rem; font-family: system-ui, sans-serif; }
		h1 { margin: 0 0 0.5rem; font-size: 16px; }
		p { margin: 0 0 1rem; font-size: 12px; color: #333; }
	</style>
</head>
<body>
	<h1>SunEditor Shadow DOM 데모</h1>
	<p>
		<code>&lt;base href="../../"&gt;</code> 로 루트의 <code>dist/</code>, <code>src/langs/</code>를 가리킵니다. 저장소 루트에서
		<code>npx serve .</code> 후 <code>/test/dev/shadow_test.html</code> 로 열 수 있습니다.
	</p>
	<div id="shadow_host"></div>

	<script src="dist/suneditor.min.js"></script>
	<script src="src/langs/ko.js"></script>
	<script>
		(function () {
			var SUNEDITOR = window.SUNEDITOR;
			if (!SUNEDITOR || typeof SUNEDITOR.create !== 'function') {
				console.error('[shadow_test] window.SUNEDITOR 가 없습니다. npm run build:dev 후 dist/suneditor.min.js 를 확인하세요.');
				return;
			}

			var BUTTON_LIST = [
				['undo', 'redo'],
				['bold', 'underline', 'italic', 'strike', 'subscript', 'superscript'],
				['removeFormat', 'copyFormat'],
				['outdent', 'indent'],
				['blockquote', 'codeBlock'],
				['align', 'font', 'fontSize', 'fontColor', 'backgroundColor'],
				['lineHeight', 'paragraphStyle', 'textStyle'],
				['list', 'hr', 'table'],
				['link', 'image'],
				['fullScreen', 'showBlocks', 'codeView', 'preview', 'print'],
				['finder'],
				['save'],
			];
			var koLang = window.SUNEDITOR_LANG && window.SUNEDITOR_LANG.ko ? window.SUNEDITOR_LANG.ko : undefined;

			var EXCLUDED_PLUGINS = [
				'exportPDF', 'fileUpload', 'layout', 'template', 'math', 'video', 'audio', 'embed', 'drawing',
				'imageGallery', 'videoGallery', 'audioGallery', 'fileGallery', 'fileBrowser', 'autocomplete',
				'pageNavigator', 'anchor',
			];

			function getEditorHtml(editor) {
				if (editor && typeof editor.getContents === 'function') return editor.getContents();
				if (editor && editor.$ && editor.$.html && typeof editor.$.html.get === 'function') return editor.$.html.get();
				return '';
			}

			function createEditor(label, targetEl, shadowRoot) {
				var editorRef = null;
				var options = {
					plugins: SUNEDITOR.plugins,
					excludedPlugins: EXCLUDED_PLUGINS,
					iframe: false,
					height: '400px',
					lang: koLang,
					buttonList: BUTTON_LIST,
					toolbar_sticky: 0,
					events: {
						onChange: function (params) {
							var data = params && params.data != null ? String(params.data) : '';
							console.log('[CHANGE][' + label + ']', data.slice(0, 80));
						},
						onSave: function (params) {
							var h = getEditorHtml(editorRef);
							if (!h && params && params.$ && params.$.html && typeof params.$.html.get === 'function') h = params.$.html.get();
							console.log('[SAVE][' + label + ']', h);
						},
					},
				};
				if (shadowRoot) options.shadowRoot = shadowRoot;
				editorRef = SUNEDITOR.create(targetEl, options);
				return editorRef;
			}

			var host = document.getElementById('shadow_host');
			var sr = host.attachShadow({ mode: 'open' });
			var link = document.createElement('link');
			link.rel = 'stylesheet';
			link.href = 'dist/suneditor.min.css';
			sr.appendChild(link);
			var link2 = document.createElement('link');
			link2.rel = 'stylesheet';
			link2.href = 'dist/suneditor-contents.min.css';
			sr.appendChild(link2);
			var ta = document.createElement('textarea');
			ta.id = 'editor_shadow';
			ta.style.display = 'none';
			sr.appendChild(ta);
			window.editorShadow = createEditor('shadow', ta, sr);
			console.log('[shadow_test] ready — shadow editor');
		})();
	</script>
</body>
</html>
